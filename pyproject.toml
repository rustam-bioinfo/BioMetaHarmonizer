[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biometaharmonizer"
dynamic = ["version"]
description = "Harmonize messy NCBI BioSample metadata at scale"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Rustam", email = "rustam.bioinfo@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.5,<3.0",
    "numpy>=1.24,<3.0",
    "biopython>=1.80,<2.0",
    "requests>=2.28,<3.0",
    "pycountry>=22.3",
    "python-dateutil>=2.8,<3.0",
    "openpyxl>=3.0,<4.0",
    "pyarrow>=12.0,<20.0",
    "rapidfuzz>=3.0.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/rustam-bioinfo/BioMetaHarmonizer"
Documentation = "https://biometaharmonizer.readthedocs.io"
"Bug Tracker" = "https://github.com/rustam-bioinfo/BioMetaHarmonizer/issues"
Changelog = "https://github.com/rustam-bioinfo/BioMetaHarmonizer/CHANGELOG.md"

[project.scripts]
biometaharmonizer = "biometaharmonizer.cli:main"

[tool.setuptools.dynamic]
version = {attr = "biometaharmonizer.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biometaharmonizer = ["schemas/*.json", "schemas/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=1.24",
]
dev = [
    "pytest",
    "pytest-cov",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
