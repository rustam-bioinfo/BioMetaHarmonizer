[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biometaharmonizer"
version = "0.4.0"
description = "Harmonize messy NCBI BioSample metadata at scale"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.24",
    "biopython>=1.80",
    "requests>=2.28",
    "pycountry>=22.3",
    "python-dateutil>=2.8",
    "openpyxl>=3.0",
    "pyarrow>=12.0",
]

[project.scripts]
biometaharmonizer = "biometaharmonizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biometaharmonizer = ["schemas/*.json", "schemas/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
